# SEG-Y configuration presets for different datasets.
# Each preset defines byte positions, key columns, sort keys, etc.
#
# Usage:
#   from config.segy_config import load_config, get_byte_pos, get_key_columns
#   load_config("field1031")            # select dataset
#   bp = get_byte_pos()                 # get active byte_pos dict
#   kc = get_key_columns()              # get active key_columns tuple
#
#   # Or override active preset via env:  SEGY_CONFIG=field1031 python train.py

# ---- Shared keywords (every preset must define these) ----
# byte_pos:       1-based byte positions in SEGY trace header
# key_columns:    Tuple of header field names forming the composite trace identity key
# sort_keys:      Sort order for output SEG-Y files
# trace_sort_keys: Default sort order for traces within a patch (coordinate axes)
# coord_col:      Mapping from coordinate name to axis index

field1031:
  byte_pos:
    shot_line: 17
    shot_no: 25
    recv_line: 61
    recv_stake: 65
    shot_stake: 21
    recv_no: 41
    shot_x: 73
    shot_y: 77
    rec_x: 81
    rec_y: 85
    cmp: 193
    cmp_line: 189
    offset: 37
  key_columns: ["shot_line", "shot_stake", "recv_line", "recv_stake"]
  sort_keys: ["recv_line", "recv_stake", "shot_line", "shot_stake"]
  trace_sort_keys: ["rx", "ry", "sx", "sy"]
  coord_col: {"sx": 0, "sy": 1, "rx": 2, "ry": 3}
  metric_weights: [1.0, 1.0, 0.5, 0.5]

sw06:
  byte_pos:
    shot_line: 221
    shot_no: 25
    recv_line: 61
    recv_stake: 229
    shot_stake: 225
    recv_no: 65
    shot_x: 73
    shot_y: 77
    rec_x: 81
    rec_y: 85
    cmp: 193
    cmp_line: 189
    offset: 37
  key_columns: ["shot_line", "shot_stake", "recv_line", "recv_stake"]
  sort_keys: ["recv_line", "recv_stake", "shot_line", "shot_stake"]
  trace_sort_keys: ["rx", "ry", "sx", "sy"]
  coord_col: {"sx": 0, "sy": 1, "rx": 2, "ry": 3}
  metric_weights: [1.0, 1.0, 0.5, 0.5]

# A002 field dataset (KN model format).
# Byte positions from knmodel_header.json (non-standard layout).
a002:
  byte_pos:
    shot_line: 137
    shot_no: 237
    recv_line: 171
    recv_no: 233
    shot_stake: 197       # sp_point (not the double at 141)
    recv_stake: 175       # gp_point
    offset: 37
    cmp: 193
    cmp_line: 189
    shot_x: 61            # float32 sp_x — needs scalar correction
    shot_y: 65            # float32 sp_y
    rec_x: 127            # float32 gp_x
    rec_y: 131            # float32 gp_y
    shot_x_grid: 73       # int32 sp_east — grid coords, no scalar
    shot_y_grid: 77       # int32 sp_north
    rec_x_grid: 81        # int32 gp_east
    rec_y_grid: 85        # int32 gp_north
    t0: 109               # delrt
    dt: 117
    scalar: 69            # scalel
  thdef_types:
    shot_line: i
    shot_no: i
    recv_line: i
    recv_no: i
    shot_stake: i
    recv_stake: i
    offset: i
    cmp: i
    cmp_line: i
    shot_x: f
    shot_y: f
    rec_x: f
    rec_y: f
    shot_x_grid: i
    shot_y_grid: i
    rec_x_grid: i
    rec_y_grid: i
    t0: h
    dt: H
    scalar: h
  key_columns: ["shot_line", "shot_stake", "recv_line", "recv_stake"]
  sort_keys: ["shot_line", "shot_stake", "recv_line", "recv_stake"]
  trace_sort_keys: ["rx", "ry", "sx", "sy"]
  coord_col: {"sx": 0, "sy": 1, "rx": 2, "ry": 3}
  metric_weights: [1.0, 1.0, 0.5, 0.5]

# Self-computed mode (coordinate-only, for segc3 data series)
# In this mode, shot_line/shot_stake/recv_line/recv_stake are not read
# from headers but computed from scaled coordinates.
segc3:
  byte_pos:
    shot_x: 73
    shot_y: 77
    rec_x: 81
    rec_y: 85
  key_columns: ["shot_line", "shot_stake", "recv_line", "recv_stake"]
  sort_keys: ["recv_line", "recv_stake", "shot_line", "shot_stake"]
  trace_sort_keys: ["rx", "ry", "sx", "sy"]
  coord_col: {"sx": 0, "sy": 1, "rx": 2, "ry": 3}
  metric_weights: [1.0, 1.0, 0.5, 0.5]
