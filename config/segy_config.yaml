# SEG-Y configuration presets for different datasets.
# Each preset defines byte positions, key columns, sort keys, etc.
#
# Usage:
#   from config.segy_config import load_config, get_byte_pos, get_key_columns
#   load_config("field1031")            # select dataset
#   bp = get_byte_pos()                 # get active byte_pos dict
#   kc = get_key_columns()              # get active key_columns tuple
#
#   # Or override active preset via env:  SEGY_CONFIG=field1031 python train.py

# ---- Shared keywords (every preset must define these) ----
# byte_pos:       1-based byte positions in SEGY trace header
# key_columns:    Tuple of header field names forming the composite trace identity key
# sort_keys:      Sort order for output SEG-Y files
# trace_sort_keys: Default sort order for traces within a patch (coordinate axes)
# coord_col:      Mapping from coordinate name to axis index

field1031:
  byte_pos:
    shot_line: 17
    shot_no: 25
    recv_line: 61
    recv_stake: 65
    shot_stake: 21
    recv_no: 41
    shot_x: 73
    shot_y: 77
    rec_x: 81
    rec_y: 85
    cmp: 193
    cmp_line: 189
    offset: 37
  key_columns: ["shot_line", "shot_stake", "recv_line", "recv_stake"]
  sort_keys: ["recv_line", "recv_stake", "shot_line", "shot_stake"]
  trace_sort_keys: ["rx", "ry", "sx", "sy"]
  coord_col: {"sx": 0, "sy": 1, "rx": 2, "ry": 3}
  metric_weights: [1.0, 1.0, 0.5, 0.5]

sw06:
  byte_pos:
    shot_line: 221
    shot_no: 25
    recv_line: 61
    recv_stake: 229
    shot_stake: 225
    recv_no: 65
    shot_x: 73
    shot_y: 77
    rec_x: 81
    rec_y: 85
    cmp: 193
    cmp_line: 189
    offset: 37
  key_columns: ["shot_line", "shot_stake", "recv_line", "recv_stake"]
  sort_keys: ["recv_line", "recv_stake", "shot_line", "shot_stake"]
  trace_sort_keys: ["rx", "ry", "sx", "sy"]
  coord_col: {"sx": 0, "sy": 1, "rx": 2, "ry": 3}
  metric_weights: [1.0, 1.0, 0.5, 0.5]

# Self-computed mode (coordinate-only, for segc3 data series)
# In this mode, shot_line/shot_stake/recv_line/recv_stake are not read
# from headers but computed from scaled coordinates.
segc3:
  byte_pos:
    shot_x: 73
    shot_y: 77
    rec_x: 81
    rec_y: 85
  key_columns: ["shot_line", "shot_stake", "recv_line", "recv_stake"]
  sort_keys: ["recv_line", "recv_stake", "shot_line", "shot_stake"]
  trace_sort_keys: ["rx", "ry", "sx", "sy"]
  coord_col: {"sx": 0, "sy": 1, "rx": 2, "ry": 3}
  metric_weights: [1.0, 1.0, 0.5, 0.5]
